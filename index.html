<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Visual Score</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Manrope:wght@500;600;700&family=Syne:wght@600;700&display=swap">
<style>
/* Layout: top bar, then the drawing sized exactly to the space it can have, the four sound knobs hugging it, and the drawing controls beside (landscape) or compactly below (portrait). */
:root{
  color-scheme: dark;
  --bg:#0a0c13;
  --panel:#121521;
  --raise:#1a1e2d;
  --line:#272c3f;
  --fg:#ece8dc;
  --muted:#8c91a8;
  --ink:#ffc46b;
  --warn:#ff7a6b;
  --shadow:rgba(0,0,0,.55);
  --display:'Syne', 'Avenir Next', 'Segoe UI', sans-serif;
  --ui:'Manrope', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
html,body{height:100%; margin:0}
[hidden]{display:none!important}
body{
  background:var(--bg); color:var(--fg); font-family:var(--ui); font-size:14px;
  overflow:hidden; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.app{box-sizing:border-box; height:100%; display:flex; flex-direction:column; gap:10px; padding-block:10px}
.main{flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px}
.left{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; width:100%; min-width:0}
.panel{width:100%; display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:12px 22px; min-width:0}
@media (min-width:880px) and (min-aspect-ratio:5/4){
  .main{flex-direction:row; gap:28px}
  .left{flex:1; height:100%}
  .panel{width:304px; flex:none; flex-direction:column; flex-wrap:nowrap; align-items:stretch; gap:18px}
}

/* Visual only: the drawing and nothing else, filling the screen. Tap to come back. */
.app.visual .top, .app.visual .knobs, .app.visual .panel{display:none}
.app.visual .main{position:fixed; inset:0; z-index:30; background:var(--bg); cursor:pointer}
.app.visual #cv{border-radius:0}

/* Top bar */
.top{display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; min-width:0; flex:none}
.brand{font-family:var(--display); font-weight:700; font-size:20px; letter-spacing:.01em; padding-block:6px; margin-right:auto}
.cluster{display:flex; align-items:center; gap:6px; flex-wrap:wrap; min-width:0}
.vsep{width:1px; height:24px; background:var(--line); margin-inline:4px}
.lab{font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
button{
  font:inherit; color:var(--fg); background:var(--raise); border:1px solid var(--line);
  border-radius:8px; min-height:40px; padding:0 12px; cursor:pointer; touch-action:manipulation; font-weight:600;
}
button:focus-visible, [role=slider]:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
button:disabled{opacity:.35; cursor:default}
.icon{width:40px; padding:0; display:grid; place-items:center}
.icon svg{width:20px; height:20px}
#mapInput{
  width:4.6ch; height:40px; padding:0 .3ch 0 .55ch; text-align:center; box-sizing:border-box;
  font-family:var(--mono); font-size:22px; letter-spacing:.22em; font-variant-numeric:tabular-nums;
  color:var(--fg); background:var(--raise); border:1px solid var(--line); border-radius:8px;
  -webkit-user-select:text; user-select:text;
}
#mapInput:focus{outline:2px solid var(--ink); outline-offset:1px}
#mapInput.flip{color:var(--ink)}
#dice.roll svg{animation:roll .5s ease-out}
@keyframes roll{from{transform:rotate(-200deg) scale(.8)}to{transform:none}}
#clipBtn.saved{border-color:var(--ink); color:var(--ink)}
.bpm{
  display:inline-flex; align-items:baseline; justify-content:center; gap:4px; height:40px; width:84px; box-sizing:border-box;
  border:1px solid var(--line); border-radius:8px; background:var(--raise); cursor:ns-resize; touch-action:none; line-height:38px;
}
.bpm span{font-family:var(--mono); font-size:19px; font-variant-numeric:tabular-nums}
.bpm small{font-size:10px; font-weight:700; letter-spacing:.1em; color:var(--muted)}
.bpm.dragging{border-color:var(--ink)}
.seg{display:inline-flex; background:var(--raise); border:1px solid var(--line); border-radius:9px; padding:3px; gap:3px}
.seg button{border:0; background:transparent; min-height:34px; border-radius:6px; color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg); color:var(--bg)}
.seg.mini button, .seg.modes button{width:38px; padding:0; display:grid; place-items:center}
.seg.mini svg, .seg.modes svg{width:20px; height:20px}
.sound, .toggle, .nav{color:var(--muted)}
.sound .on{display:none}
#playBtn .pl{display:none}
#playBtn.paused .pl{display:inline}
#playBtn.paused .st{display:none}
.sound[aria-pressed="true"], .toggle[aria-pressed="true"], .nav[aria-pressed="true"]{color:var(--fg); border-color:var(--ink)}
.sound[aria-pressed="true"] .on{display:inline}
.sound[aria-pressed="true"] .off{display:none}
@media (max-width:440px){
  .brand, .vsep{display:none}
  .top{gap:8px}
  .top .icon{width:38px; min-height:38px}
  #mapInput, .bpm{height:38px}
}

/* Preferences */
.settings{
  position:fixed; top:64px; right:max(16px, env(safe-area-inset-right, 0px)); z-index:40; width:min(330px, calc(100vw - 32px));
  max-height:calc(100% - 80px); overflow-y:auto; box-sizing:border-box;
  background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px;
  display:flex; flex-direction:column; gap:10px; box-shadow:0 16px 40px var(--shadow);
}
.settings h3{margin:6px 0 0; font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
.srow{display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:34px; font-weight:600}
.switch{position:relative; width:42px; height:24px; flex:none}
.switch input{position:absolute; inset:0; opacity:0; margin:0; cursor:pointer}
.switch span{position:absolute; inset:0; border-radius:12px; background:var(--line); pointer-events:none}
.switch span::after{content:""; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:var(--muted); transition:transform .15s}
.switch input:checked + span{background:var(--ink)}
.switch input:checked + span::after{transform:translateX(18px); background:var(--bg)}
.switch input:focus-visible + span{outline:2px solid var(--fg); outline-offset:2px}
.settings output{white-space:nowrap; min-width:4ch; text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums; color:var(--muted)}
.settings .seg{align-self:flex-start}
.shead{display:flex; justify-content:space-between; align-items:center}
.shead button{min-height:32px; width:32px}
.vrow{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.vols{gap:20px; padding:2px 4px}
input[type=range]{-webkit-appearance:none; appearance:none; flex:1; min-width:0; height:36px; background:transparent; touch-action:none; margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px; border-radius:3px; background:var(--line)}
input[type=range]::-moz-range-track{height:6px; border-radius:3px; background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:24px; height:24px; margin-top:-9px; border-radius:50%; background:var(--fg); border:0}
input[type=range]::-moz-range-thumb{width:24px; height:24px; border-radius:50%; background:var(--fg); border:0}

/* Stage: sized by script to exactly the drawing, so nothing sits on top of it */
.stage{position:relative; flex:none}
#cv{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none}
#cv.wide{border-radius:14px}
.recpill{
  position:fixed; top:12px; left:50%; transform:translateX(-50%); z-index:45; display:flex; align-items:center; gap:10px;
  background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:4px 4px 4px 14px; white-space:nowrap;
}
.recpill .dot{width:9px; height:9px; border-radius:50%; background:var(--warn); animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.recpill span{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:13px}
.recpill button{min-height:32px; border-radius:999px}

/* Knob row */
.knobs{display:flex; justify-content:center; align-items:flex-start; gap:clamp(18px, 5vw, 44px); flex:none}
.kwrap{display:flex; flex-direction:column; align-items:center; gap:3px}
.kn{position:relative; width:46px; height:46px; flex:none; touch-action:none; cursor:ns-resize; border-radius:50%}
.kn svg{width:100%; height:100%; display:block; overflow:visible}
.kn .kv{position:absolute; inset:0; display:grid; place-items:center; font-family:var(--mono); font-size:13px; font-variant-numeric:tabular-nums; pointer-events:none}
.kn.big{width:58px; height:58px}
.kwrap.big{width:72px}
.kn.big .kv{font-size:16px}
.kl{font-size:11px; font-weight:700; color:var(--muted)}
@media (max-width:440px){ .kn.big{width:50px; height:50px} .kn.big .kv{font-size:14px} .knobs{gap:14px} }

/* Panel */
.group{display:flex; flex-direction:column; gap:8px; min-width:0}
.group h2{margin:0; font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); display:none}
.group h2 .mname{color:var(--fg); letter-spacing:.04em; text-transform:none; font-size:12px; margin-left:6px}
.row{display:flex; gap:10px; align-items:center}
.prow{display:flex; gap:8px; align-items:center}
.prow .kwrap{width:48px}
.icon.round{width:46px; height:46px; min-height:46px; border-radius:50%}
.tools{display:grid; grid-template-columns:repeat(5, 52px); gap:6px}
.tool{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; height:54px; padding:0; font-size:11px; color:var(--muted)}
.tool svg{width:24px; height:24px}
.tool[aria-pressed="true"]{color:var(--fg); border-color:var(--ink); background:#20253a}
.tool[aria-pressed="true"] svg{color:var(--ink)}
.sizegroup{flex:1 1 220px; max-width:330px}
.sizebar{position:relative; height:50px; width:100%; touch-action:none; cursor:ew-resize}
.sizebar canvas{display:block; width:100%; height:100%}
.swatches{display:grid; grid-template-columns:repeat(10, 28px); gap:5px}
.sw{width:28px; height:28px; min-height:28px; padding:0; border-radius:50%; border:2px solid transparent; position:relative}
.sw::after{content:""; position:absolute; inset:3px; border-radius:50%; background:var(--c)}
.sw[aria-pressed="true"]{border-color:var(--fg)}
@media (min-width:880px) and (min-aspect-ratio:5/4){
  .group h2{display:block}
  .prow{min-height:64px}
  .tools{grid-template-columns:repeat(5, 1fr)}
  .sizegroup{flex:none; max-width:none}
  .swatches{grid-template-columns:repeat(10, minmax(0, 1fr)); gap:4px}
  .sw{width:100%; height:auto; aspect-ratio:1; min-height:0}
}
@media (max-width:440px){ .tools{grid-template-columns:repeat(5, minmax(0, 54px))} .swatches{grid-template-columns:repeat(10, minmax(0, 32px)); gap:4px} .sw{width:100%; height:auto; aspect-ratio:1; min-height:0} }

/* Clips page */
.clips{flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:12px; padding-bottom:12px}
.chead{display:flex; align-items:center; gap:12px}
.chead h2{margin:0; font-family:var(--display); font-size:22px}
.chead .count{color:var(--muted); margin-right:auto}
.nowbar{display:flex; align-items:center; gap:12px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:8px}
.nowbar canvas{width:64px; height:64px; border-radius:8px; flex:none}
.nowbar span{flex:1; min-width:0; color:var(--muted)}
.nowbar b{color:var(--fg)}
.clipgrid{display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:12px}
.clipcard{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px; display:flex; flex-direction:column; gap:8px; min-width:0}
.clipcard.playing{border-color:var(--ink)}
.clipcard img{width:100%; aspect-ratio:1; object-fit:cover; border-radius:8px; background:#121521; display:block}
.cmeta{display:flex; flex-direction:column; gap:2px; min-width:0}
.cmeta b{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.cmeta span{color:var(--muted); font-size:12px}
.cbtns{display:flex; gap:6px}
.cbtns .grow{flex:1}
.cbtns .del.armed{color:var(--bg); background:var(--warn); border-color:var(--warn); width:auto; padding:0 10px}
.empty{color:var(--muted); padding:40px 0; text-align:center; grid-column:1 / -1; line-height:1.5}

/* Export dialog */
.scrim{position:fixed; inset:0; z-index:50; background:rgba(5,6,10,.6); display:grid; place-items:center; padding:16px}
.dialog{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; width:min(380px, 100%); box-sizing:border-box; display:flex; flex-direction:column; gap:12px; box-shadow:0 20px 50px var(--shadow)}
.dialog h3{margin:0; font-family:var(--display); font-size:19px}
.dialog p{margin:0; color:var(--muted); line-height:1.45; font-size:13px}
.opts{display:grid; grid-template-columns:1fr 1fr; gap:6px}
.opts button[aria-pressed="true"]{border-color:var(--ink); color:var(--ink)}
.dialog .go{background:var(--fg); color:var(--bg); border-color:var(--fg)}
.toast{position:fixed; left:50%; bottom:calc(16px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%); z-index:60; background:var(--fg); color:var(--bg); padding:10px 16px; border-radius:10px; font-weight:600; max-width:calc(100vw - 48px)}
@media (prefers-reduced-motion: reduce){ #dice.roll svg{animation:none} .switch span::after{transition:none} .recpill .dot{animation:none} }
</style>

<div class="app" id="app">
  <header class="top">
    <div class="brand">Visual Score</div>
    <div class="cluster" role="group" aria-label="Music">
      <label class="lab" for="mapInput">Map</label>
      <input id="mapInput" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="3" value="417" aria-label="Map number, 000 to 999">
      <button id="dice" class="icon" aria-label="Randomize" title="Randomize">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="8.5" cy="8.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="15.5" cy="15.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="15.5" cy="8.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="8.5" cy="15.5" r="1.3" fill="currentColor" stroke="none"/></svg>
      </button>
      <div id="bpm" class="bpm" role="slider" tabindex="0" aria-label="Tempo" aria-valuemin="40" aria-valuemax="180" aria-valuenow="92" title="Drag up or down to change tempo"><span id="bpmVal">92</span><small>BPM</small></div>
      <div class="seg mini" id="timeSeg" role="group" aria-label="Loop timing">
        <button id="timeC" data-v="clocked" aria-label="Clocked loops" title="Clocked loops"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 21h10L14 4h-4z"/><path d="M12 16l6-9"/><path d="M9.2 17h5.6"/></svg></button>
        <button id="timeH" data-v="hand" aria-label="Hand-drawn loop lengths" title="Hand-drawn loop lengths"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15c3-6 5 4 8-2s5 3 7-1c1-2 2-3 3-3"/></svg></button>
      </div>
    </div>
    <div class="cluster" role="group" aria-label="Edit">
      <button id="undoBtn" class="icon" aria-label="Undo" title="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
      <button id="redoBtn" class="icon" aria-label="Redo" title="Redo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
      <button id="clearBtn" class="icon" aria-label="Clear the canvas" title="Clear"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/></svg></button>
      <span class="vsep"></span>
      <button id="clipBtn" class="icon" aria-label="Keep this as a clip" title="Keep this as a clip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="4.6" opacity=".55"/></svg></button>
      <button id="clipsNav" class="icon nav" aria-pressed="false" aria-label="Clips" title="Clips"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7.5" height="7.5" rx="1.6"/><rect x="13" y="3.5" width="7.5" height="7.5" rx="1.6"/><rect x="3.5" y="13" width="7.5" height="7.5" rx="1.6"/><rect x="13" y="13" width="7.5" height="7.5" rx="1.6" opacity=".45"/></svg></button>
      <button id="exportBtn" class="icon" aria-label="Export" title="Export"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M7.5 10.5L12 15l4.5-4.5"/><path d="M5 19h14"/></svg></button>
      <span class="vsep"></span>
      <button id="playBtn" class="icon" aria-label="Stop" title="Play / stop"><svg viewBox="0 0 24 24"><path class="pl" d="M7 5v14l12-7z" fill="currentColor"/><rect class="st" x="6" y="6" width="12" height="12" rx="1.5" fill="currentColor"/></svg></button>
      <button id="cogBtn" class="icon cogbtn" aria-label="Preferences" title="Preferences" aria-expanded="false" aria-controls="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
  </header>

  <div class="main" id="main">
    <div class="left" id="left">
      <div class="stage" id="stage"><canvas id="cv" aria-label="Drawing canvas. Draw to change the music."></canvas></div>
      <section class="knobs" id="knobRow" aria-label="Sound controls">
        <div class="kwrap big"><div class="kn big" id="knDensity" role="slider" tabindex="0" aria-label="Density" aria-valuemin="0" aria-valuemax="100"></div><span class="kl">Density</span></div>
        <div class="kwrap big"><div class="kn big" id="knProb" role="slider" tabindex="0" aria-label="Probability" aria-valuemin="0" aria-valuemax="100"></div><span class="kl">Probability</span></div>
        <div class="kwrap big"><div class="kn big" id="knSpace" role="slider" tabindex="0" aria-label="Space" aria-valuemin="0" aria-valuemax="100"></div><span class="kl">Space</span></div>
        <div class="kwrap big"><div class="kn big" id="knTone" role="slider" tabindex="0" aria-label="Tone" aria-valuemin="0" aria-valuemax="100"></div><span class="kl">Tone</span></div>
      </section>
    </div>

    <aside class="panel" id="panel" aria-label="Drawing controls">
      <section class="group">
        <h2>Pattern<span class="mname" id="modeName"></span></h2>
        <div class="prow" id="paramRow">

for (const [id, k] of [['prTempo', 'rTempo'], ['prMode', 'rMode'], ['prFolds', 'rFolds']]) {
  $(id).checked = !!prefs[k];
  $(id).addEventListener('change', e => { prefs[k] = e.target.checked; savePrefs(); });
}
const showGlide = () => { $('prGlide').value = prefs.glide; $('prGlideOut').textContent = (prefs.glide / 1000).toFixed(1) + ' s'; };
$('prGlide').addEventListener('input', e => { prefs.glide = +e.target.value; showGlide(); savePrefs(); });
showGlide();
$('shapeSeg').addEventListener('click', e => { const v = e.target.closest('button')?.dataset.v; if (v) { prefs.shape = v; savePrefs(); applyView(); } });
$('visualBtn').addEventListener('click', () => setVisual(true));
function applyView() {
  for (const b of $('shapeSeg').children) b.setAttribute('aria-pressed', String(b.dataset.v === prefs.shape));
  requestAnimationFrame(layout);
}
// Visual only: full screen, nothing else. Any tap comes back
function setVisual(on) {
  if (on === isVisual()) return;
  if (on && page === 'clips') showPage('canvas');
  openSettings(false);
  $('app').classList.toggle('visual', on);
  if (on) { const el = document.documentElement; if (el.requestFullscreen) el.requestFullscreen().catch(() => {}); }
  else if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
  requestAnimationFrame(layout);
}
$('main').addEventListener('click', () => { if (isVisual()) setVisual(false); });
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && isVisual()) setVisual(false); });

function syncSound() {
  const on = playing && !paused;
  $('playBtn').classList.toggle('paused', !on);
  $('playBtn').setAttribute('aria-label', on ? 'Stop' : 'Play');
}
function syncUI() {
  const m = score.mode, free = m === 'free';
  for (const md of MODES) $('mode-' + md.id).setAttribute('aria-pressed', String(m === md.id));
  $('modeName').textContent = MODES.find(md => md.id === m).name;
  for (const v of ['tones', 'both', 'drums']) $('inst-' + v).setAttribute('aria-pressed', String(score.inst === v));
  $('timeC').setAttribute('aria-pressed', String(score.timing === 'clocked'));
  $('timeH').setAttribute('aria-pressed', String(score.timing === 'hand'));
  $('pk2').hidden = free; $('rotBtn').hidden = !free;
  $('pk1l').textContent = P1[pm()][3]; $('pk1').setAttribute('aria-label', P1[pm()][3]);
  $('pk2l').textContent = free ? 'Rotate' : P2[pm()][3]; $('pk2').setAttribute('aria-label', P2[pm()][3]);
  $('mirrorBtn').setAttribute('aria-pressed', String(mirrored()));
  $('rotBtn').setAttribute('aria-pressed', String(score.frot));
  for (const t of TOOLS) $('tool-' + t.id).setAttribute('aria-pressed', String(ui.tool === t.id));
  PALETTE.forEach((c, i) => $('sw-' + i).setAttribute('aria-pressed', String(ui.color === i)));
  document.documentElement.style.setProperty('--ink', PALETTE[ui.color]);
  $('sizeLabel').textContent = ui.tool === 'erase' ? 'Eraser size' : 'Brush size';
  if (!anim) mapInput.value = String(score.map).padStart(3, '0');
  $('bpmVal').textContent = score.tempo;
  $('undoBtn').disabled = !undoStack.length;
  $('redoBtn').disabled = !redoStack.length;
  $('clearBtn').disabled = !score.strokes.length;
  pk1.draw(); pk2.draw(); for (const key in mixKnobs) mixKnobs[key].draw();
  drawSizeBar(); syncSound();
}

/* ================= Init ================= */
ARR = arrange(); LANES = ARR.lanes;
{
  let pend = 0;
  const ro = new ResizeObserver(() => { if (!pend) pend = requestAnimationFrame(() => { pend = 0; layout(); }); });
  for (const id of ['main', 'panel', 'knobRow', 'sizeBar']) ro.observe($(id));
}
applyView();
layout();
syncUI();
requestAnimationFrame(frame);
setInterval(schedule, 25);
document.addEventListener('visibilitychange', () => { if (!document.hidden && playing) lastEnd = Math.max(lastEnd, sessionNow()); });
</script>

</body>
